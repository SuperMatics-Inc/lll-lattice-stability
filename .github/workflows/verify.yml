name: Verify supplement
on: [push, pull_request, workflow_dispatch]
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/verify_pins.py
      - run: python scripts/verify.py --output replay-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-replay
          path: replay-output
  partial-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/verify_pins.py
      - name: Check the partition, curve, cusp and negative controls
        run: uv run --no-project --with-requirements requirements.txt python gstmap/replay.py --ci-subset --workers 4 --output map-replay-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-map-replay
          path: map-replay-output
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        path: [lean, gstmap/lean]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for Lean and Mathlib
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ matrix.path }}
          build: true
          test: false
          lint: false
